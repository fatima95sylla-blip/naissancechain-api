<VirtualHost *:80>
    ServerName naissancechain.local
    ServerAlias www.naissancechain.local
    
    DocumentRoot "C:/wamp64/www/naissancechain-api/public"
    
    <Directory "C:/wamp64/www/naissancechain-api/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Security Headers
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:"
        
        # CORS Headers for Flutter/API
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-CSRF-TOKEN"
        Header always set Access-Control-Allow-Credentials "true"
        
        # Compression
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/plain
            AddOutputFilterByType DEFLATE text/html
            AddOutputFilterByType DEFLATE text/xml
            AddOutputFilterByType DEFLATE text/css
            AddOutputFilterByType DEFLATE application/xml
            AddOutputFilterByType DEFLATE application/xhtml+xml
            AddOutputFilterByType DEFLATE application/rss+xml
            AddOutputFilterByType DEFLATE application/javascript
            AddOutputFilterByType DEFLATE application/x-javascript
        </IfModule>
        
        # Cache Control
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType image/png "access plus 1 month"
            ExpiresByType image/jpg "access plus 1 month"
            ExpiresByType image/jpeg "access plus 1 month"
            ExpiresByType image/gif "access plus 1 month"
            ExpiresByType image/ico "access plus 1 year"
            ExpiresByType image/icon "access plus 1 year"
            ExpiresByType text/html "access plus 1 seconds"
        </IfModule>
        
        # Laravel URL Rewriting
        <IfModule mod_rewrite.c>
            <IfModule mod_negotiation.c>
                Options -MultiViews -Indexes
            </IfModule>
            
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} -d [OR]
            RewriteCond %{REQUEST_FILENAME} -f
            RewriteRule ^ ^$ public/index.php [L]
            RewriteRule ^(.*)$ public/index.php/$1 [L]
        </IfModule>
        
        # Protect sensitive files
        <Files ".env*">
            Require all denied
        </Files>
        <Files "*.log">
            Require all denied
        </Files>
        <Files "*.key">
            Require all denied
        </Files>
        
        # Protect directories
        <Directory "C:/wamp64/www/naissancechain-api/storage">
            Require all denied
        </Directory>
        <Directory "C:/wamp64/www/naissancechain-api/bootstrap/cache">
            Require all denied
        </Directory>
        <Directory "C:/wamp64/www/naissancechain-api/vendor">
            Require all denied
        </Directory>
    </Directory>
    
    # Error handling
    ErrorLog "C:/wamp64/logs/naissancechain_error.log"
    CustomLog "C:/wamp64/logs/naissancechain_access.log" combined
    
    # Performance
    KeepAlive On
    KeepAliveTimeout 5
    MaxKeepAliveRequests 100
    
    # PHP Settings
    <IfModule mod_php7.c>
        php_value max_execution_time 300
        php_value memory_limit 512M
        php_value upload_max_filesize 10M
        php_value post_max_size 12M
        php_value max_input_vars 3000
    </IfModule>
    
    <IfModule mod_php8.c>
        php_value max_execution_time 300
        php_value memory_limit 512M
        php_value upload_max_filesize 10M
        php_value post_max_size 12M
        php_value max_input_vars 3000
    </IfModule>
</VirtualHost>

# HTTPS Configuration (if SSL certificate is available)
<VirtualHost *:443>
    ServerName naissancechain.local
    ServerAlias www.naissancechain.local
    
    DocumentRoot "C:/wamp64/www/naissancechain-api/public"
    
    <Directory "C:/wamp64/www/naissancechain-api/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Security Headers for HTTPS
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; upgrade-insecure-requests"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        
        # CORS Headers for Flutter/API
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-CSRF-TOKEN"
        Header always set Access-Control-Allow-Credentials "true"
    </Directory>
    
    ErrorLog "C:/wamp64/logs/naissancechain_ssl_error.log"
    CustomLog "C:/wamp64/logs/naissancechain_ssl_access.log" combined
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile "C:/wamp64/bin/apache/conf/ssl/naissancechain.crt"
    SSLCertificateKeyFile "C:/wamp64/bin/apache/conf/ssl/naissancechain.key"
    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite HIGH:!aNULL:!MD5
</VirtualHost>
