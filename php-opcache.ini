; OPcache Configuration for NaissanceChain API
; Place this in your PHP configuration or add to php.ini

[opcache]
; Enable OPcache
opcache.enable=1

; Enable OPcache for CLI (important for Artisan commands)
opcache.enable_cli=1

; Memory usage (512MB for production)
opcache.memory_consumption=512

; Number of cached files (4000 for Laravel)
opcache.max_accelerated_files=4000

; Revalidate frequency (0 for production)
opcache.revalidate_freq=0

; Validate timestamps (0 for production performance)
opcache.validate_timestamps=0

; Save comments (0 for better performance)
opcache.save_comments=0

; Load comments (0 for better performance)
opcache.load_comments=0

; Enable fast shutdown
opcache.fast_shutdown=1

; Enable file cache
opcache.file_cache=1

; File cache size (64MB)
opcache.file_cache_size=64

; Restrict API access to specific files
opcache.restrict_api=""

; Blacklist files (if needed)
; opcache.blacklist_filename=""

; Error log level
opcache.log_verbosity_level=1

; Use realpath cache
opcache.use_cwd=1

; Allow file overwrite
opcache.allow_file_override=1

; Enable function override
opcache.enable_file_override=1

; Optimization level (maximum)
opcache.optimization_level=0xFFFFFFFF

; Inherited memory limit
opcache.inherited_hack=1

; Consistency checks (disabled for production)
opcache.consistency_checks=0

; Max wasted percentage
opcache.max_wasted_percentage=5

; Force path info
opcache.force_path_info=0

; Error reporting
opcache.error_log="C:/wamp64/logs/opcache_errors.log"

; Log verbosity
opcache.log_verbosity_level=1

; Protect memory
opcache.protect_memory=0

; Save and load comments
opcache.save_comments=1
opcache.load_comments=1

; JIT Compilation (PHP 8.0+)
opcache.jit=1255
opcache.jit_buffer_size=64M
opcache.jit_func_root=0
opcache.jit_try=1
